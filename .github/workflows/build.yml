name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install premake5
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\premake.zip"
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\premake" -Force
          echo "$env:RUNNER_TEMP\premake" | Out-File -Append $env:GITHUB_PATH

      - name: Generate VS2019 solution
        run: premake5 vs2019

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Release x64
        run: msbuild build\solutions\dp8-dwmglass.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dp8-dwmglass-release
          path: build\bin\Release-windows-x86_64\
          if-no-files-found: error
