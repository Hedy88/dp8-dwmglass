name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install premake5
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\premake.zip"
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\premake" -Force
          echo "$env:RUNNER_TEMP\premake" | Out-File -Append $env:GITHUB_PATH

      - name: Generate VS2022 solution
        run: premake5 vs2022

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Release x64
        run: msbuild build\solutions\dp8-dwmglass.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dp8-dwmglass-release
          path: build\bin\Release-windows-x86_64\
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dp8-dwmglass-release
          path: release

      - name: Package
        run: |
          cd release
          zip -r ../dp8-dwmglass-${{ github.ref_name }}.zip .

      - name: Create GitHub Release (public)
        uses: softprops/action-gh-release@v2
        with:
          files: dp8-dwmglass-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
